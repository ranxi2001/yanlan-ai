name: Bug report
description: 报告可复现的功能问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果和预期结果，不要粘贴 API Key 或真实会议内容。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的错误信息
      render: shell
